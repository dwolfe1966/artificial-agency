[project]
name = "artificial-agency"
version = "0.1.0"
description = "Empirical apparatus for artificial agency research."
requires-python = ">=3.11"
dependencies = [
  "inspect-ai>=0.3.260",
  "openai>=3.1.0",
]

[project.entry-points.inspect_ai]
artificial_agency = "artificial_agency._registry"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["artificial_agency*"]
