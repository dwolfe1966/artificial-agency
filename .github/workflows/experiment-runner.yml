name: Experiment Runner

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Registered experiment run ID"
        required: true
        type: choice
        options:
          - "002A"
          - "003A"
          - "003B"
          - "004A"
          - "004B"
          - "005B"
          - "005C"
          - "006A-GPT"
          - "006B-CLAUDE"
          - "006C-GEMINI"
          - "007A-GPT"
          - "007B-CLAUDE"
          - "007C-GEMINI"
          - "008A-GPT"
          - "008B-CLAUDE"
          - "008C-GEMINI"
          - "008B-A-GPT"
          - "008B-B-CLAUDE"
          - "008B-C-GEMINI"
          - "008B2-A-GPT"
          - "008B2-B-CLAUDE"
          - "008B2-C-GEMINI"
          - "PERSISTENCE_DIAGNOSTIC"
      action:
        description: "Runner action"
        required: true
        type: choice
        options:
          - start
          - preflight
          - status
          - health
          - stop
          - resume
          - finalize

permissions:
  contents: read

concurrency:
  group: experiment-runner-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Experiment Runner
    runs-on:
      - self-hosted
      - macOS
      - artificial-agency
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Verify trusted workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.run_id }}" in
            002A|003A|003B|004A|004B|005B|005C|006A-GPT|006B-CLAUDE|006C-GEMINI|007A-GPT|007B-CLAUDE|007C-GEMINI|008A-GPT|008B-CLAUDE|008C-GEMINI|008B-A-GPT|008B-B-CLAUDE|008B-C-GEMINI|008B2-A-GPT|008B2-B-CLAUDE|008B2-C-GEMINI|PERSISTENCE_DIAGNOSTIC) ;;
            *) echo "Unsupported run_id"; exit 2 ;;
          esac
          case "${{ inputs.action }}" in
            start|preflight|status|health|stop|resume|finalize) ;;
            *) echo "Unsupported action"; exit 2 ;;
          esac

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          if [[ "${{ inputs.run_id }}" == "005B" || "${{ inputs.run_id }}" == "006B-CLAUDE" || "${{ inputs.run_id }}" == "007B-CLAUDE" || "${{ inputs.run_id }}" == "008B-CLAUDE" || "${{ inputs.run_id }}" == "008B-B-CLAUDE" || "${{ inputs.run_id }}" == "008B2-B-CLAUDE" ]]; then
            .venv/bin/python -m pip install "anthropic>=0.39.0"
          fi
          if [[ "${{ inputs.run_id }}" == "005C" || "${{ inputs.run_id }}" == "006C-GEMINI" || "${{ inputs.run_id }}" == "007C-GEMINI" || "${{ inputs.run_id }}" == "008C-GEMINI" || "${{ inputs.run_id }}" == "008B-C-GEMINI" || "${{ inputs.run_id }}" == "008B2-C-GEMINI" ]]; then
            .venv/bin/python -m pip install "google-genai>=1.0.0"
          fi

      - name: Verify execution context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.run_id }}" == "002A" || "${{ inputs.run_id }}" == "003A" || "${{ inputs.run_id }}" == "003B" || "${{ inputs.run_id }}" == "004A" || "${{ inputs.run_id }}" == "004B" || "${{ inputs.run_id }}" == "006A-GPT" || "${{ inputs.run_id }}" == "007A-GPT" || "${{ inputs.run_id }}" == "008A-GPT" || "${{ inputs.run_id }}" == "008B-A-GPT" || "${{ inputs.run_id }}" == "008B2-A-GPT" ]]; then
            test -n "${OPENAI_API_KEY:-}" || {
              echo "OPENAI_API_KEY is not configured for this runner."
              exit 2
            }
            launchctl setenv OPENAI_API_KEY "${OPENAI_API_KEY}"
          fi
          if [[ "${{ inputs.run_id }}" == "005B" || "${{ inputs.run_id }}" == "006B-CLAUDE" || "${{ inputs.run_id }}" == "007B-CLAUDE" || "${{ inputs.run_id }}" == "008B-CLAUDE" || "${{ inputs.run_id }}" == "008B-B-CLAUDE" || "${{ inputs.run_id }}" == "008B2-B-CLAUDE" ]]; then
            test -n "${ANTHROPIC_API_KEY:-}" || {
              echo "ANTHROPIC_API_KEY is not configured for this runner."
              exit 2
            }
            launchctl setenv ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY}"
          fi
          if [[ "${{ inputs.run_id }}" == "005C" || "${{ inputs.run_id }}" == "006C-GEMINI" || "${{ inputs.run_id }}" == "007C-GEMINI" || "${{ inputs.run_id }}" == "008C-GEMINI" || "${{ inputs.run_id }}" == "008B-C-GEMINI" || "${{ inputs.run_id }}" == "008B2-C-GEMINI" ]]; then
            test -n "${GOOGLE_API_KEY:-}" || {
              echo "GOOGLE_API_KEY is not configured for this runner."
              exit 2
            }
            launchctl setenv GOOGLE_API_KEY "${GOOGLE_API_KEY}"
          fi
          .venv/bin/python - <<'PY'
          from artificial_agency.runner.config import known_runs
          spec = known_runs()["${{ inputs.run_id }}"]
          print(f"Run: {spec.run_id}")
          print(f"Experiment: {spec.experiment_id}")
          print(f"Frozen scientific SHA: {spec.frozen_commit}")
          print(f"Model: {spec.model}")
          PY

      - name: Dispatch runner command
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          .venv/bin/python -m artificial_agency.runner "${{ inputs.action }}" "${{ inputs.run_id }}"

      - name: Print operational status
        if: always()
        shell: bash
        run: |
          set +e
          export PYTHONPATH="${GITHUB_WORKSPACE}"
          .venv/bin/python -m artificial_agency.runner status "${{ inputs.run_id }}"
          echo "--- health ---"
          .venv/bin/python -m artificial_agency.runner health "${{ inputs.run_id }}"
